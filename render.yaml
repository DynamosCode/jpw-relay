services:
  # ── Relay Server (receives tokens from Hook APK) ──────────────────────────
  - type: web
    name: jpw-relay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn relay_server:app -b 0.0.0.0:10000 --workers 1 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # ── Telegram Bot ──────────────────────────────────────────────────────────
  - type: worker
    name: jpw-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python jpw_bot_v4.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false          # manually set in Render dashboard
      - key: ACCESS_PASSWORD
        sync: false          # manually set in Render dashboard
      - key: DEFAULT_LAT
        value: 28.6139
      - key: DEFAULT_LON
        value: 77.2090
      - key: JPW_APP_VERSION
        value: 2.1.1
      - key: RELAY_URL
        sync: false          # set this to your jpw-relay URL after deploy
